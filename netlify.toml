# Netlify builds the Next.js website (static export). It uses the published tlp-icons package from npm.
[build]
  command = "cd web && npm install --no-audit --no-fund && npm run build"
  publish = "web/out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# old single-page gallery links
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/docs.html"
  to = "/docs/"
  status = 301
