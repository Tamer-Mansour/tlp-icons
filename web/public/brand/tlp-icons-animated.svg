<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="logo-title logo-desc"><title id="logo-title">tlp-icons</title><desc id="logo-desc">Four geometric icons assemble; the rose glyph lifts and settles.</desc><style>
svg{overflow:visible}
#circle,#square,#triangle,#alive,.motion{transform-box:view-box;animation-duration:5.2s;animation-timing-function:cubic-bezier(.2,.75,.25,1);animation-iteration-count:infinite;animation-fill-mode:both}
#circle{transform-origin:270px 380px;animation-name:circle-in}
#square{transform-origin:270px 720px;animation-name:square-in}
#triangle{transform-origin:650px 718px;animation-name:triangle-in}
#alive{transform-origin:710px 290px;animation-name:alive-in}
.motion{transform-origin:520px 240px;animation-name:trails}
.motion:last-child{animation-name:trails-second}
@keyframes circle-in{0%{opacity:0;transform:translateY(65px) scale(.3)}5%{opacity:1}11%{transform:translateY(-6px) scale(1.065)}16%,92%{opacity:1;transform:none}100%{opacity:0;transform:scale(.95)}}
@keyframes square-in{0%,6%{opacity:0;transform:translateX(-65px) rotate(-9deg) scale(.7)}10%{opacity:1}18%{transform:translateX(5px) rotate(2deg) scale(1.035)}23%,92%{opacity:1;transform:none}100%{opacity:0;transform:scale(.95)}}
@keyframes triangle-in{0%,12%{opacity:0;transform:translateY(60px) rotate(13deg) scale(.65)}17%{opacity:1}24%{transform:translateY(-5px) rotate(-2deg) scale(1.04)}29%,92%{opacity:1;transform:none}100%{opacity:0;transform:scale(.95)}}
@keyframes alive-in{0%,20%{opacity:0;transform:translate(-28px,34px) rotate(-22deg) scale(.25)}24%{opacity:1}33%{transform:translate(3px,-8px) rotate(6deg) scale(1.08)}38%{transform:none}47%{transform:translate(14px,-34px) rotate(10deg) scale(1.025)}54%{transform:translate(-3px,5px) rotate(-3deg)}61%,92%{opacity:1;transform:none}100%{opacity:0;transform:scale(.95)}}
@keyframes trails{0%,30%{opacity:0;transform:translate(-8px,9px) scale(.8)}37%,40%{opacity:.55;transform:none}47%{opacity:1;transform:translate(1px,-7px) scale(1.08)}57%{opacity:.45;transform:none}65%,92%{opacity:.85;transform:none}100%{opacity:0}}
@keyframes trails-second{0%,33%{opacity:0;transform:translate(-8px,9px) scale(.8)}40%{opacity:.55;transform:none}50%{opacity:1;transform:translate(1px,-7px) scale(1.08)}60%{opacity:.45;transform:none}67%,92%{opacity:.85;transform:none}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){#circle,#square,#triangle,#alive,.motion{animation:none!important;opacity:1;transform:none}}
</style><circle id="circle" cx="270" cy="380" r="160" fill="#741D3D"/><rect id="square" x="110" y="570" width="320" height="300" rx="58" fill="#741D3D"/><path id="triangle" fill="#741D3D" d="M615 590 C638 556 665 556 688 590 L817 803 C837 837 822 866 780 866 H522 C480 866 464 837 484 803 Z"/><g id="alive"><path id="moving-glyph" fill="#BE617A" d="M701 100 C732 100 751 121 760 151 C773 194 795 204 832 212 C876 223 900 243 900 278 C900 313 877 337 846 357 C811 380 802 399 790 435 C778 470 753 486 723 479 C695 472 682 448 659 423 C636 396 619 390 583 381 C543 371 520 350 520 318 C520 285 542 265 571 247 C610 223 620 206 632 170 C647 123 665 100 701 100 Z"/></g><path class="motion" fill="#BE617A" d="M440 258 C469 203 515 166 560 154 C571 151 578 163 570 170 C521 185 480 218 463 266 C456 276 441 272 440 258 Z"/><path class="motion" fill="#BE617A" d="M459 321 C473 279 501 246 532 228 C542 222 553 232 546 241 C515 262 492 289 480 323 C475 335 458 335 459 321 Z"/></svg>