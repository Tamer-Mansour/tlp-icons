name: CI
# Manual only (Actions tab -> CI -> Run workflow). Local equivalent: npm test && npm run test:browser
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # build + unit tests run offline from the committed upstream/ snapshot
      - run: npm test
      - name: Browser tests
        run: |
          npm run setup:browser
          npx --yes playwright@latest install-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-strips
          path: test/browser/shots/
